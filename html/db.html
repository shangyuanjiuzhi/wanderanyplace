<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard - Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../iconfont/iconfont.css">
</head>
<body class="bg-slate-100 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="iconfont icon-database text-2xl text-rose-600"></i>
          <h1 class="text-2xl font-bold text-slate-800">Admin Dashboard</h1>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm text-slate-600">
            <span id="activeCount" class="text-rose-600 font-bold">0</span> items
          </span>
          <button onclick="refreshActiveTab()" class="bg-rose-600 text-white px-4 py-2 rounded-lg hover:bg-rose-700 transition-colors">
            <i class="iconfont icon-shuaxin mr-2"></i>Refresh
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-6">
      <button 
        id="tabComments" 
        onclick="switchTab('comments')"
        class="px-6 py-2.5 bg-white border-2 border-rose-500 text-rose-600 rounded-lg font-medium transition-colors"
      >
        <i class="iconfont icon-pinglun mr-2"></i>Comments
      </button>
      <button 
        id="tabPosts" 
        onclick="switchTab('posts')"
        class="px-6 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:border-rose-300 hover:text-rose-600 transition-colors"
      >
        <i class="iconfont icon-biaoqian mr-2"></i>Posts
      </button>
      <button 
        id="tabPostComments" 
        onclick="switchTab('postcomments')"
        class="px-6 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:border-rose-300 hover:text-rose-600 transition-colors"
      >
        Post Comments
      </button>
    </div>

    <!-- Comments Panel -->
    <div id="panelComments" class="block">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <h2 class="text-lg font-semibold text-slate-800">All Comments</h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Article</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nickname</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Content</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Time</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="commentsTableBody" class="divide-y divide-slate-200">
              <!-- Comments will be loaded here -->
            </tbody>
          </table>
        </div>

        <div id="commentsEmptyState" class="hidden px-6 py-12 text-center">
          <p class="text-slate-500">No comments yet</p>
        </div>
      </div>
    </div>

    <!-- Posts Panel -->
    <div id="panelPosts" class="hidden">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <h2 class="text-lg font-semibold text-slate-800">All Posts</h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Type</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nickname</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Title</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Content</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Area</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Time</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="postsTableBody" class="divide-y divide-slate-200">
              <!-- Posts will be loaded here -->
            </tbody>
          </table>
        </div>

        <div id="postsEmptyState" class="hidden px-6 py-12 text-center">
          <p class="text-slate-500">No posts yet</p>
        </div>
      </div>
    </div>

    <!-- Post Comments Panel -->
    <div id="panelPostComments" class="hidden">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <h2 class="text-lg font-semibold text-slate-800">All Post Comments</h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Post</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nickname</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Content</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Time</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="postCommentsTableBody" class="divide-y divide-slate-200">
              <!-- Post Comments will be loaded here -->
            </tbody>
          </table>
        </div>

        <div id="postCommentsEmptyState" class="hidden px-6 py-12 text-center">
          <p class="text-slate-500">No post comments yet</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = '';
    let activeTab = 'comments';

    document.addEventListener('DOMContentLoaded', () => {
      loadComments();
    });

    function switchTab(tab) {
      activeTab = tab;
      
      // Update tab styles
      document.getElementById('tabComments').className = tab === 'comments' 
        ? 'px-6 py-2.5 bg-white border-2 border-rose-500 text-rose-600 rounded-lg font-medium transition-colors'
        : 'px-6 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:border-rose-300 hover:text-rose-600 transition-colors';
      
      document.getElementById('tabPosts').className = tab === 'posts' 
        ? 'px-6 py-2.5 bg-white border-2 border-rose-500 text-rose-600 rounded-lg font-medium transition-colors'
        : 'px-6 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:border-rose-300 hover:text-rose-600 transition-colors';
      
      // Update tab styles
      document.getElementById('tabPostComments').className = tab === 'postcomments' 
        ? 'px-6 py-2.5 bg-white border-2 border-rose-500 text-rose-600 rounded-lg font-medium transition-colors'
        : 'px-6 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:border-rose-300 hover:text-rose-600 transition-colors';
      
      // Show/hide panels
      document.getElementById('panelComments').style.display = tab === 'comments' ? 'block' : 'none';
      document.getElementById('panelPosts').style.display = tab === 'posts' ? 'block' : 'none';
      document.getElementById('panelPostComments').style.display = tab === 'postcomments' ? 'block' : 'none';
      
      // Load data for active tab
      if (tab === 'posts') {
        loadPosts();
      } else if (tab === 'postcomments') {
        loadPostComments();
      } else {
        loadComments();
      }
    }

    function refreshActiveTab() {
      if (activeTab === 'comments') {
        loadComments();
      } else if (activeTab === 'posts') {
        loadPosts();
      } else {
        loadPostComments();
      }
    }

    // Comments Functions
    async function loadComments() {
      try {
        const response = await fetch(`${API_BASE}/api/admin/comments`);
        const result = await response.json();

        if (result.success) {
          renderComments(result.data);
          document.getElementById('activeCount').textContent = result.total;
        } else {
          alert('Failed to load comments');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    function renderComments(comments) {
      const tbody = document.getElementById('commentsTableBody');
      const emptyState = document.getElementById('commentsEmptyState');

      if (comments.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tbody.innerHTML = comments.map(comment => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">#${comment.id}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${escapeHtml(comment.article_id)}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center font-bold text-sm">
                ${comment.nick.charAt(0).toUpperCase()}
              </div>
              <span class="text-sm text-slate-900">${escapeHtml(comment.nick)}</span>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-slate-700 max-w-md truncate">${escapeHtml(comment.content)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${formatDate(comment.create_time)}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <button onclick="deleteComment(${comment.id})" class="inline-flex items-center gap-1 bg-red-50 text-red-600 px-3 py-1.5 rounded-md hover:bg-red-100 hover:text-red-800 transition-colors text-sm font-medium" title="Delete comment">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteComment(id) {
      if (!confirm('Are you sure you want to delete this comment?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/admin/comments/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (result.success) {
          alert('Comment deleted successfully');
          loadComments();
        } else {
          alert(result.message || 'Failed to delete comment');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    // Posts Functions
    async function loadPosts() {
      try {
        const response = await fetch(`${API_BASE}/api/admin/posts`);
        const result = await response.json();

        if (result.success) {
          renderPosts(result.data);
          document.getElementById('activeCount').textContent = result.total;
        } else {
          alert('Failed to load posts');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    function renderPosts(posts) {
      const tbody = document.getElementById('postsTableBody');
      const emptyState = document.getElementById('postsEmptyState');

      if (posts.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tbody.innerHTML = posts.map(post => {
        const typeColors = {
          'Question': 'bg-blue-100 text-blue-700',
          'Share': 'bg-green-100 text-green-700',
          'Help': 'bg-red-100 text-red-700'
        };
        return `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">#${post.id}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 py-1 rounded-full text-xs font-medium ${typeColors[post.type] || 'bg-gray-100 text-gray-700'}">${escapeHtml(post.type)}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center font-bold text-sm">
                  ${post.nick.charAt(0).toUpperCase()}
                </div>
                <span class="text-sm text-slate-900">${escapeHtml(post.nick)}</span>
              </div>
            </td>
            <td class="px-6 py-4 text-sm text-slate-700 max-w-xs truncate">${escapeHtml(post.title)}</td>
            <td class="px-6 py-4 text-sm text-slate-700 max-w-md truncate">${escapeHtml(post.content)}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${escapeHtml(post.area || '-')}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${formatDate(post.create_time)}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <button onclick="deletePost(${post.id})" class="inline-flex items-center gap-1 bg-red-50 text-red-600 px-3 py-1.5 rounded-md hover:bg-red-100 hover:text-red-800 transition-colors text-sm font-medium" title="Delete post">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/admin/posts/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (result.success) {
          alert('Post deleted successfully');
          loadPosts();
        } else {
          alert(result.message || 'Failed to delete post');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Post Comments Functions
    async function loadPostComments() {
      try {
        const response = await fetch(`${API_BASE}/api/admin/post-comments`);
        const result = await response.json();

        if (result.success) {
          renderPostComments(result.data);
          document.getElementById('activeCount').textContent = result.total;
        } else {
          alert('Failed to load post comments');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    function renderPostComments(comments) {
      const tbody = document.getElementById('postCommentsTableBody');
      const emptyState = document.getElementById('postCommentsEmptyState');

      if (comments.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tbody.innerHTML = comments.map(comment => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">#${comment.id}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">
            ${comment.post_title ? `<a href="/html/travel-guides/community-id_${comment.post_id}.html" target="_blank" class="text-rose-600 hover:underline">${escapeHtml(comment.post_title)}</a>` : `Post #${comment.post_id}`}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center font-bold text-sm">
                ${comment.nick.charAt(0).toUpperCase()}
              </div>
              <span class="text-sm text-slate-900">${escapeHtml(comment.nick)}</span>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-slate-700 max-w-md truncate">${escapeHtml(comment.content)}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${formatDate(comment.create_time)}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <button onclick="deletePostComment(${comment.id})" class="inline-flex items-center gap-1 bg-red-50 text-red-600 px-3 py-1.5 rounded-md hover:bg-red-100 hover:text-red-800 transition-colors text-sm font-medium" title="Delete comment">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function deletePostComment(id) {
      if (!confirm('Are you sure you want to delete this post comment?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/admin/post-comments/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (result.success) {
          alert('Post comment deleted successfully');
          loadPostComments();
        } else {
          alert(result.message || 'Failed to delete post comment');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
  </script>
</body>
</html>
